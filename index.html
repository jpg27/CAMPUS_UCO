<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at center, #8ab54e 0%, #5a8a2a 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitulo {
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      margin-bottom: 50px;
      text-align: center;
    }

    .botones {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 280px;
    }

    .btn {
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      text-decoration: none;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-mapa {
      background: white;
      color: #3a7a1a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn-carrera {
      background: #2a5a0a;
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn-ar {
      background: #1a1a5e;
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      transform: translateY(-2px);
    }
    @media (max-width: 480px) {
      .botones { width: 90%; max-width: 280px; }
      .btn { font-size: 16px; padding: 14px; }
    }
  </style>
</head>
<body>

  <div class="logo">Universidad Catolica De Oriente</div>
  <div class="subtitulo">Bienvenido al mapa interactivo</div>

  <div class="botones">
    <a href="mapa.html" class="btn btn-mapa">Mapa</a>
    <a href="carrera.html" class="btn btn-carrera">Iniciar Carrera</a>
    <a href="ar.html" class="btn btn-ar" onclick="localStorage.clear()">📷 Modo Libre</a>
    <a href="login-admin.html" class="btn" style="background: rgba(255,255,255,0.2); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">⚙️ Admin</a>
  </div>

</body>
</html>
