<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carrera UCO</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

  <!-- TIPOGRAFÍA INTER -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- LUCIDE ICONS -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>


  <style>

    /* =====================================================
       VARIABLES DEL DESIGN SYSTEM
       ===================================================== */

    :root {

      /* Verde UCO */
      --color-primary: #087A45;
      --color-primary-dark: #056337;
      --color-primary-pressed: #04532E;

      /* Verdes secundarios */
      --color-secondary: #299447;
      --color-green-light: #91C59D;
      --color-green-soft: #C2DDCC;
      --color-green-tint: #EAF5EE;

      /* Fondos */
      --color-background: #F8FAF9;
      --color-surface: #FFFFFF;

      /* Textos */
      --color-text: #123D2A;
      --color-text-secondary: #71817A;

      /* Bordes */
      --color-border: #E2E9E5;

      /* Error */
      --color-error: #B3261E;
      --color-error-bg: #FDF0EF;
      --color-error-border: #F3CFCC;

      /* Radios */
      --radius-card: 18px;
      --radius-input: 14px;
      --radius-button: 14px;

      /* Sombras */
      --shadow-card: 0 4px 16px rgba(18, 61, 42, 0.08);
      --shadow-button: 0 4px 12px rgba(8, 122, 69, 0.18);
    }


    /* =====================================================
       RESET Y BASE
       ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      background: var(--color-background);

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: 'Inter', sans-serif;
      color: var(--color-text);

      overflow-x: hidden;
      position: relative;
    }


    /* =====================================================
       DECORACIÓN (igual que el menú principal)
       ===================================================== */

    .decoracion {
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }

    /* ESQUINA SUPERIOR IZQUIERDA */

    .decoracion-superior {
      width: 220px;
      height: 220px;

      top: -105px;
      left: -80px;

      background: #91C59D;

      border-radius: 70% 30% 65% 35% / 55% 45% 55% 45%;

      opacity: 0.55;
      transform: rotate(-25deg);
    }

    .decoracion-superior::before {
      content: "";
      position: absolute;

      width: 125px;
      height: 75px;

      top: 115px;
      left: 95px;

      background: #299447;

      border-radius: 80% 20% 80% 20% / 60% 40% 60% 40%;

      opacity: 0.42;
      transform: rotate(35deg);
    }

    .decoracion-superior::after {
      content: "";
      position: absolute;

      width: 95px;
      height: 58px;

      top: 145px;
      left: 135px;

      background: #087A45;

      border-radius: 80% 20% 80% 20% / 60% 40% 60% 40%;

      opacity: 0.28;
      transform: rotate(65deg);
    }

    /* ESQUINA INFERIOR DERECHA */

    .decoracion-inferior {
      width: 240px;
      height: 240px;

      bottom: -130px;
      right: -95px;

      background: #91C59D;

      border-radius: 30% 70% 35% 65% / 45% 55% 45% 55%;

      opacity: 0.48;
      transform: rotate(25deg);
    }

    .decoracion-inferior::before {
      content: "";
      position: absolute;

      width: 135px;
      height: 80px;

      bottom: 125px;
      right: 105px;

      background: #299447;

      border-radius: 20% 80% 20% 80% / 40% 60% 40% 60%;

      opacity: 0.38;
      transform: rotate(-35deg);
    }

    .decoracion-inferior::after {
      content: "";
      position: absolute;

      width: 100px;
      height: 62px;

      bottom: 155px;
      right: 145px;

      background: #087A45;

      border-radius: 20% 80% 20% 80% / 40% 60% 40% 60%;

      opacity: 0.25;
      transform: rotate(-65deg);
    }


    /* =====================================================
       CONTENEDOR PRINCIPAL
       ===================================================== */

    .contenedor {
      width: 100%;
      max-width: 400px;
      padding: 32px 28px;

      position: relative;
      z-index: 1;
    }


    /* =====================================================
       PANTALLA: FORMULARIO
       ===================================================== */

    #pantalla-form.oculto {
      display: none;
    }

    .encabezado {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-img {
      display: block;
      width: 168px;
      max-width: 60%;
      height: auto;
      margin: 0 auto 24px;
    }

    .icono-carrera {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--color-primary);
    }

    .icono-carrera svg {
      width: 60px;
      height: 60px;
    }

    /* Rellenos del ícono: mismo color del fondo para "tapar" la ruta punteada */
    .icono-carrera .relleno {
      fill: var(--color-background);
    }

    .titulo {
      font-size: 26px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--color-text);
      margin-bottom: 6px;
    }

    .subtitulo {
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 1.5;
    }


    /* =====================================================
       CAMPOS
       ===================================================== */

    .campo {
      margin-bottom: 16px;
      text-align: left;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;

      color: var(--color-text);
      font-size: 13px;
      font-weight: 600;
    }

    .input-icono {
      position: relative;
    }

    .input-icono svg {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);

      width: 20px;
      height: 20px;

      color: var(--color-primary);
      stroke-width: 2;
      pointer-events: none;
    }

    .campo input {
      width: 100%;
      height: 52px;
      padding: 0 16px 0 46px;

      background: var(--color-surface);
      color: var(--color-text);

      border: 1px solid var(--color-border);
      border-radius: var(--radius-input);

      box-shadow: inset 0 2px 4px rgba(18, 61, 42, 0.05);

      font-family: inherit;
      font-size: 16px;

      outline: none;

      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .campo input::placeholder {
      color: var(--color-text-secondary);
      opacity: 0.8;
    }

    /* Enfocado: borde verde de 2 px sin mover el layout */
    .campo input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 1px var(--color-primary);
    }


    /* =====================================================
       BOTÓN UNIRSE
       ===================================================== */

    .btn-unirse {
      width: 100%;
      height: 54px;
      margin-top: 8px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      color: white;

      border: none;
      border-radius: var(--radius-button);
      box-shadow: var(--shadow-button);

      font-family: inherit;
      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        filter 0.15s ease;
    }

    .btn-unirse svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.4;
      fill: currentColor;
    }

    .btn-unirse:hover {
      filter: brightness(0.92);
      box-shadow: 0 7px 20px rgba(8, 122, 69, 0.22);
    }

    .btn-unirse:active {
      transform: scale(0.98);
      filter: brightness(0.85);
    }

    .btn-unirse:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 3px;
    }

    .btn-unirse:disabled {
      background: var(--color-green-soft);
      color: var(--color-primary-dark);
      box-shadow: none;
      filter: none;
      transform: none;
      cursor: not-allowed;
    }


    /* =====================================================
       MENSAJE DE ERROR
       ===================================================== */

    .error {
      display: none;

      margin-top: 16px;
      padding: 12px 14px;

      background: var(--color-error-bg);
      color: var(--color-error);

      border: 1px solid var(--color-error-border);
      border-radius: 12px;

      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    .error.visible {
      display: block;
    }


    /* =====================================================
       ENLACE VOLVER
       ===================================================== */

    .volver {
      margin-top: 24px;

      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: var(--color-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;

      border-radius: 8px;

      transition: color 0.15s ease;
    }

    .volver svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    .volver:hover {
      color: var(--color-primary);
    }

    .volver:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 3px;
    }


    /* =====================================================
       PANTALLA: ESPERA
       ===================================================== */

    #pantalla-espera {
      display: none;
      text-align: center;
    }

    #pantalla-espera.visible {
      display: block;
    }

    .espera-icono {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--color-green-tint);
      color: var(--color-primary);

      border-radius: 50%;

      animation: pulso 1.6s ease-in-out infinite;
    }

    .espera-icono svg {
      width: 34px;
      height: 34px;
      stroke-width: 1.8;
    }

    @keyframes pulso {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    .espera-titulo {
      color: var(--color-text);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }

    .espera-subtitulo {
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .espera-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);

      padding: 24px;
    }

    .espera-nombre {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 4px;
    }

    .espera-sesion {
      color: var(--color-text-secondary);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .espera-estado {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      background: var(--color-green-tint);
      border-radius: 14px;

      padding: 14px;
    }

    .espera-estado-texto {
      color: var(--color-primary-dark);
      font-size: 14px;
      font-weight: 600;
    }

    .dot-loading {
      display: flex;
      gap: 6px;
    }

    .dot-loading span {
      width: 10px;
      height: 10px;

      background: var(--color-primary);
      border-radius: 50%;

      animation: bounce 1.2s infinite;
    }

    .dot-loading span:nth-child(2) { animation-delay: 0.2s; }
    .dot-loading span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
      40%           { transform: scale(1.2); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .espera-icono,
      .dot-loading span {
        animation: none;
      }
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 480px) {

      .contenedor {
        padding: 28px 24px;
      }

      .logo-img {
        width: 150px;
        margin-bottom: 20px;
      }

      .titulo {
        font-size: 24px;
      }

      .espera-titulo {
        font-size: 22px;
      }

      .espera-card {
        padding: 20px 16px;
      }
    }

    .input-icono input[aria-invalid="true"] {
      border-color: #E3A39E;
      box-shadow: 0 0 0 3px #FDF0EF;
    }

  </style>
  <link rel="stylesheet" href="styles/avisos.css">
</head>


<body>

  <!-- DECORACIONES -->
  <div class="decoracion decoracion-superior"></div>
  <div class="decoracion decoracion-inferior"></div>


  <main class="contenedor">

    <!-- ═══ Formulario de ingreso ═══ -->
    <div id="pantalla-form">

      <header class="encabezado">

        <!-- Logo UCO (img/ucolargo.webp) -->
        <img
          src="img/ucolargo.webp"
          alt="Universidad Católica de Oriente"
          class="logo-img"
        >

        <div class="icono-carrera">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 42H36a6 6 0 0 0 0-12H16a6 6 0 0 1 0-12H33" stroke-dasharray="2.4 3.6"/>
            <path d="M38 19V4"/>
            <path d="M38 5h8l-2.5 3.5L46 12h-8"/>
            <circle class="relleno" cx="28" cy="30" r="2.6"/>
            <circle class="relleno" cx="21" cy="18" r="2.6"/>
            <path class="relleno" d="M9 45.5s-6.5-5.6-6.5-10.5a6.5 6.5 0 0 1 13 0C15.5 39.9 9 45.5 9 45.5z"/>
            <circle cx="9" cy="35" r="2.2"/>
          </svg>
        </div>

        <h1 class="titulo">Carrera UCO</h1>

        <p class="subtitulo">Ingresa tus datos para participar</p>

      </header>

      <div class="campo">
        <label for="input-nombre">Nombre y apellido</label>
        <div class="input-icono">
          <i data-lucide="user" aria-hidden="true"></i>
          <input
            type="text"
            id="input-nombre"
            placeholder="Ej: Juan Pérez"
            maxlength="40"
            autocomplete="name"
            autocapitalize="words"
          >
        </div>
      </div>

      <div class="campo">
        <label for="input-codigo">Código de sesión</label>
        <div class="input-icono">
          <i data-lucide="ticket" aria-hidden="true"></i>
          <input
            type="text"
            id="input-codigo"
            placeholder="Ej: UCO-2025"
            maxlength="20"
            autocomplete="off"
            style="text-transform: uppercase;"
          >
        </div>
      </div>

      <button class="btn-unirse" id="btn-unirse" type="button">
        <i data-lucide="play" aria-hidden="true"></i>
        Unirse a la carrera
      </button>

      <!-- Los errores ahora se muestran como notificación (Avisos.js); se deja
           el contenedor oculto por compatibilidad. -->
      <div class="error" id="mensaje-error" role="alert" hidden></div>

      <a href="index.html" class="volver">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
        Volver al menú
      </a>

    </div>


    <!-- ═══ Pantalla de espera ═══ -->
    <div id="pantalla-espera">

      <div class="espera-icono">
        <i data-lucide="hourglass" aria-hidden="true"></i>
      </div>

      <h2 class="espera-titulo">¡Estás dentro!</h2>

      <p class="espera-subtitulo">
        Esperando que el administrador inicie la carrera...
      </p>

      <div class="espera-card">
        <div class="espera-nombre" id="espera-nombre"></div>
        <div class="espera-sesion" id="espera-sesion"></div>

        <div class="espera-estado">
          <div class="dot-loading">
            <span></span><span></span><span></span>
          </div>
          <span class="espera-estado-texto">Esperando inicio...</span>
        </div>
      </div>

    </div>

  </main>


  <!-- LÓGICA DE LA CARRERA (sin cambios) -->
  <script type="module">
    import { CarreraController } from './src/controllers/CarreraController.js';
    const app = new CarreraController();
    app.init();
  </script>

  <!-- ACTIVAR LUCIDE -->
  <script>
    if (window.lucide) {
      lucide.createIcons();
    } else {
      console.error("Lucide no se cargó: revisa la conexión o la URL del script.");
    }
  </script>

</body>

</html>
