<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrera UCO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at center, #8ab54e 0%, #2a5a0a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .titulo {
      font-size: 26px;
      font-weight: bold;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitulo {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      margin-bottom: 40px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .card h2 {
      color: #1a2e1a;
      font-size: 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    .campo {
      margin-bottom: 18px;
    }

    .campo label {
      display: block;
      color: #555;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .campo input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .campo input:focus {
      border-color: #3a7a1a;
    }

    .btn-unirse {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #3a7a1a, #5a9a2a);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 4px 15px rgba(58,122,26,0.4);
    }

    .btn-unirse:active {
      transform: scale(0.98);
    }

    .btn-unirse:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #cc0000;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 14px;
      display: none;
      text-align: center;
    }

    .error.visible { display: block; }

    .volver {
      margin-top: 20px;
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 14px;
    }

    /* Pantalla de espera */
    #pantalla-espera {
      display: none;
      text-align: center;
    }

    #pantalla-espera.visible { display: block; }
    #pantalla-form.oculto { display: none; }

    .espera-icono {
      font-size: 64px;
      margin-bottom: 16px;
      animation: pulso 1.5s ease-in-out infinite;
    }

    @keyframes pulso {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .espera-titulo {
      color: white;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .espera-subtitulo {
      color: rgba(255,255,255,0.8);
      font-size: 15px;
      margin-bottom: 30px;
    }

    .espera-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      max-width: 380px;
      margin: 0 auto;
    }

    .espera-nombre {
      font-size: 20px;
      font-weight: bold;
      color: #3a7a1a;
      margin-bottom: 4px;
    }

    .espera-sesion {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .espera-estado {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #f0f8f0;
      border-radius: 12px;
      padding: 14px;
    }

    .dot-loading {
      display: flex;
      gap: 6px;
    }

    .dot-loading span {
      width: 10px;
      height: 10px;
      background: #3a7a1a;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot-loading span:nth-child(2) { animation-delay: 0.2s; }
    .dot-loading span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
      40% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Formulario de ingreso -->
  <div id="pantalla-form">
    <div class="logo">🏃</div>
    <div class="titulo">Carrera UCO</div>
    <div class="subtitulo">Ingresa tus datos para participar</div>

    <div class="card">
      <h2>¡Únete a la carrera!</h2>

      <div class="campo">
        <label>Tu nombre o nickname</label>
        <input type="text" id="input-nombre" placeholder="Ej: Juan123" maxlength="30">
      </div>

      <div class="campo">
        <label>Código de sesión</label>
        <input type="text" id="input-codigo" placeholder="Ej: UCO-2025" maxlength="20" style="text-transform: uppercase;">
      </div>

      <button class="btn-unirse" id="btn-unirse" onclick="unirse()">
        🚀 Unirse a la carrera
      </button>

      <div class="error" id="mensaje-error"></div>
    </div>

    <a href="index.html" class="volver">← Volver al menú</a>
  </div>

  <!-- Pantalla de espera -->
  <div id="pantalla-espera">
    <div class="espera-icono">⏳</div>
    <div class="espera-titulo">¡Estás dentro!</div>
    <div class="espera-subtitulo">Esperando que el administrador inicie la carrera...</div>

    <div class="espera-card">
      <div class="espera-nombre" id="espera-nombre"></div>
      <div class="espera-sesion" id="espera-sesion"></div>
      <div class="espera-estado">
        <div class="dot-loading">
          <span></span><span></span><span></span>
        </div>
        <span style="color: #3a7a1a; font-weight: bold;">Esperando inicio...</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { obtenerSesionPorCodigo, unirseASesion, supabase } from './supabase.js';

    let participanteActual = null;
    let sesionActual = null;

    window.unirse = async function() {
      const nombre = document.getElementById('input-nombre').value.trim();
      const codigo = document.getElementById('input-codigo').value.trim();
      const btn    = document.getElementById('btn-unirse');
      const error  = document.getElementById('mensaje-error');

      error.classList.remove('visible');

      if (!nombre) {
        mostrarError('Por favor ingresa tu nombre o nickname');
        return;
      }
      if (!codigo) {
        mostrarError('Por favor ingresa el código de sesión');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Buscando sesión...';

      try {
        // Buscar sesión activa
        const sesion = await obtenerSesionPorCodigo(codigo);

        if (!sesion) {
          mostrarError('Código incorrecto o la sesión no está activa todavía. Espera a que el administrador la inicie.');
          btn.disabled = false;
          btn.textContent = '🚀 Unirse a la carrera';
          return;
        }

        // Unirse a la sesión
        const participante = await unirseASesion(sesion.id, nombre);

        participanteActual = participante;
        sesionActual = sesion;

        // Guardar en sessionStorage para usar en el mapa AR
        sessionStorage.setItem('participante', JSON.stringify(participante));
        sessionStorage.setItem('sesion', JSON.stringify(sesion));

        // Mostrar pantalla de espera o ir directo si ya está activa
        mostrarEspera(nombre, sesion);

      } catch (e) {
        mostrarError('Ocurrió un error. Intenta de nuevo.');
        btn.disabled = false;
        btn.textContent = '🚀 Unirse a la carrera';
      }
    };

    function mostrarError(msg) {
      const error = document.getElementById('mensaje-error');
      error.textContent = msg;
      error.classList.add('visible');
    }

    function mostrarEspera(nombre, sesion) {
      document.getElementById('pantalla-form').classList.add('oculto');
      document.getElementById('pantalla-espera').classList.add('visible');
      document.getElementById('espera-nombre').textContent = '👋 Hola, ' + nombre;
      document.getElementById('espera-sesion').textContent = 'Sesión: ' + sesion.nombre + ' · ' + sesion.codigo;

      // Escuchar cuando el admin cambia el estado
      supabase
        .channel('sesion-' + sesion.id)
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'sesiones',
          filter: `id=eq.${sesion.id}`
        }, (payload) => {
          if (payload.new.estado === 'activa') {
            // Ir al mapa
            window.location.href = 'mapa.html';
          } else if (payload.new.estado === 'cerrada') {
            mostrarError('La sesión fue cerrada por el administrador.');
          }
        })
        .subscribe();
    }

    // Enter para unirse
    document.getElementById('input-codigo').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') window.unirse();
    });
    document.getElementById('input-nombre').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') document.getElementById('input-codigo').focus();
    });
  </script>

</body>
</html>
